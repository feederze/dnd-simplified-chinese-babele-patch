name: Create Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * *"  # 每天北京时间 03:00 运行一次

# 同一时间只允许一个发布任务运行，避免两个任务算出同一个版本号
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 获取上一版本并递增
        id: version
        run: |
          set -euo pipefail
          # releases/latest 指向最新一次标记为 Latest 的 release（与 tag 名无关）
          base_url="https://github.com/${{ github.repository }}/releases/latest/download"
          if curl -sL --fail -o module_release.json "$base_url/module.json"; then
            version=$(jq -r '.version' module_release.json)
            echo "从最新 release 获取版本: $version"
          else
            version=$(jq -r '.version' dnd-simplified-chinese-babele-patch/module.json)
            echo "从仓库获取版本: $version"
          fi

          # 下载上一版本的压缩包，用于判断本次是否有变化
          mkdir -p prev
          if curl -sL --fail -o prev.zip "$base_url/dnd-simplified-chinese-babele-patch.zip"; then
            unzip -q prev.zip -d prev
          fi
          rm -f prev.zip module_release.json

          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          new_patch=$((patch + 1))
          # 避免与已有 tag 冲突
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$new_patch" >/dev/null; do
            new_patch=$((new_patch + 1))
          done
          new_version="$major.$minor.$new_patch"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "新版本: $new_version"

      - name: 下载翻译
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZAPITOKEN }}
        run: |
          set -euo pipefail
          curl -L -o "translation.zip" --header "Authorization: $PARATRANZ_TOKEN" "https://paratranz.cn/api/projects/13245/artifacts/download"

          TARGET_DIR="dnd-simplified-chinese-babele-patch/translation/cn"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          unzip -q -j translation.zip -d "$TARGET_DIR"
          rm -f translation.zip

      - name: 修剪 mapping 字段
        run: |
          set -euo pipefail
          for file in dnd-simplified-chinese-babele-patch/translation/cn/*.json; do
            filename=$(basename "$file")
            if [[ "$filename" == "labels.json" || "$filename" == "titles.json" ]]; then
              continue
            fi
            jq 'del(.mapping)' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

      - name: 生成 labels.json / titles.json
        env:
          SCRIPT_PATH: tools/generate-light-index.mjs
          INPUT_DIRS: |
            dnd-simplified-chinese-babele-patch/translation/cn
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "错误: 脚本文件不存在于 $SCRIPT_PATH"
            exit 1
          fi

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ ! -d "$dir" ]; then
              echo "警告: 找不到输入目录: $dir"
              continue
            fi
            echo "正在处理目录: $dir"
            node "$SCRIPT_PATH" --input "$dir" --include-folders
          done <<< "$INPUT_DIRS"

      - name: 检查是否有变化
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，强制发布"
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ ! -d prev/dnd-simplified-chinese-babele-patch ]; then
            echo "没有找到上一版本，发布新版本"
            echo "changed=true" >> $GITHUB_OUTPUT
          elif diff -rq --exclude=module.json prev/dnd-simplified-chinese-babele-patch dnd-simplified-chinese-babele-patch; then
            echo "与上一版本相比没有变化，跳过发布"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 更新 module.json 版本并压缩
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          MODULE_JSON=dnd-simplified-chinese-babele-patch/module.json
          jq --arg v "$VERSION" \
             --arg manifest "$REPO_URL/releases/latest/download/module.json" \
             --arg download "$REPO_URL/releases/download/v$VERSION/dnd-simplified-chinese-babele-patch.zip" \
             '.version = $v | .manifest = $manifest | .download = $download' \
             "$MODULE_JSON" > "$MODULE_JSON.tmp" && mv "$MODULE_JSON.tmp" "$MODULE_JSON"
          echo "已更新打包用 module.json 版本为 $VERSION"
          rm -f dnd-simplified-chinese-babele-patch.zip
          zip -r dnd-simplified-chinese-babele-patch.zip dnd-simplified-chinese-babele-patch

      - name: 创建新 Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: |
            自动构建的翻译更新。
            版本：${{ steps.version.outputs.version }}
            Manifest：https://github.com/${{ github.repository }}/releases/latest/download/module.json
            直链：https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/dnd-simplified-chinese-babele-patch.zip
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dnd-simplified-chinese-babele-patch.zip
            dnd-simplified-chinese-babele-patch/module.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 旧版本的 manifest 指向名为 latest 的 tag，同步更新它以兼容老用户
      - name: 同步旧版 latest Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Legacy latest（当前版本 v${{ steps.version.outputs.version }}）
          body: |
            此 release 仅为兼容旧版 manifest 地址而保留，内容与 v${{ steps.version.outputs.version }} 相同。
            新的 Manifest 地址：https://github.com/${{ github.repository }}/releases/latest/download/module.json
          draft: false
          prerelease: false
          make_latest: false
          files: |
            dnd-simplified-chinese-babele-patch.zip
            dnd-simplified-chinese-babele-patch/module.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
