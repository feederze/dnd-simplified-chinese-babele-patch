name: Create Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * *"  # 每天北京时间 03:00 运行一次

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 获取并递增版本
        id: version
        run: |
          release_url="https://github.com/${{ github.repository }}/releases/download/latest/module.json"
          if curl -sL --fail -o module_release.json "$release_url" 2>/dev/null; then
            version=$(jq -r '.version' module_release.json)
            echo "从 release 获取版本: $version"
          else
            version=$(jq -r '.version' dnd-simplified-chinese-babele-patch/module.json)
            echo "从仓库获取版本: $version"
          fi
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          new_patch=$((patch + 1))
          new_version="$major.$minor.$new_patch"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "新版本: $new_version"

      - name: 下载翻译
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZAPITOKEN }}
        run: |
          set -euo pipefail
          curl -L -o "translation.zip" --header "Authorization: $PARATRANZ_TOKEN" "https://paratranz.cn/api/projects/13245/artifacts/download"

          TARGET_DIR="dnd-simplified-chinese-babele-patch/translation/cn"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          unzip -q -j translation.zip -d "$TARGET_DIR"
          rm -f translation.zip

      - name: 修剪 mapping 字段
        run: |
          set -euo pipefail
          for file in dnd-simplified-chinese-babele-patch/translation/cn/*.json; do
            filename=$(basename "$file")
            if [[ "$filename" == "labels.json" || "$filename" == "titles.json" ]]; then
              continue
            fi
            jq 'del(.mapping)' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

      - name: 生成 labels.json / titles.json
        env:
          SCRIPT_PATH: tools/generate-light-index.mjs
          INPUT_DIRS: |
            dnd-simplified-chinese-babele-patch/translation/cn
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "错误: 脚本文件不存在于 $SCRIPT_PATH"
            exit 1
          fi

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ ! -d "$dir" ]; then
              echo "警告: 找不到输入目录: $dir"
              continue
            fi
            echo "正在处理目录: $dir"
            node "$SCRIPT_PATH" --input "$dir" --include-folders
          done <<< "$INPUT_DIRS"

      - name: 更新 module.json 版本并压缩
        run: |
          set -euo pipefail
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' dnd-simplified-chinese-babele-patch/module.json > dnd-simplified-chinese-babele-patch/module.json.tmp && mv dnd-simplified-chinese-babele-patch/module.json.tmp dnd-simplified-chinese-babele-patch/module.json
          echo "已更新打包用 module.json 版本为 ${{ steps.version.outputs.version }}"
          if [ ! -f "dnd-simplified-chinese-babele-patch.zip" ]; then
            zip -r dnd-simplified-chinese-babele-patch.zip dnd-simplified-chinese-babele-patch
          fi

      - name: 更新Latest Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest release ${{ steps.version.outputs.version }}
          body: |
            自动构建的翻译更新。
            版本：${{ steps.version.outputs.version }}
            直链：https://github.com/${{ github.repository }}/releases/download/latest/dnd-simplified-chinese-babele-patch.zip
          draft: false
          prerelease: false
          files: |
            dnd-simplified-chinese-babele-patch.zip
            dnd-simplified-chinese-babele-patch/module.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
