# 一次性任务：把名为 latest 的旧 release 改成指向 Latest 标记的说明。运行后删除本文件。
name: Update Legacy Release

on:
  workflow_dispatch:

jobs:
  update-legacy-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 更新旧版 latest Release 说明
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Legacy latest（已停止更新，请使用 Latest 版本）
          body: |
            此 release 已停止更新，仅为兼容旧版 manifest 地址而保留。

            通过旧地址安装的用户更新一次后，会自动切换到新的 manifest 地址，之后跟随 GitHub 标记为 Latest 的 release 更新。

            最新版本：https://github.com/${{ github.repository }}/releases/latest
            Manifest：https://github.com/${{ github.repository }}/releases/latest/download/module.json
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
